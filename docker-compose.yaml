services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    env_file:
      - ./server/.env.local
    networks:
      - my_network

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - my_network

  # server:
  #   build: ./server
  #   ports:
  #     - 3005:3000
  #   networks:
  #     - my_network
  #   env_file:
  #     - ./server/.env.prod
  #   environment:
  #     - NODE_ENV=prod
  #     - MONGODB_URI=mongodb://mongodb:27017/Class4

  # client:
  #   build: ./client
  #   ports:
  #     - 3001:80
  #   networks:
  #     - my_network

volumes:
  redis_data:
  mongo_data:

networks:
  my_network:
    driver: bridge
